name: Django Meilisearch CD
on:
  push:
    branches: [main]


jobs:
  Publish-Package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Create release
        run: |
          PACKAGE_VERSION=$(cat pyproject.toml | grep "^version = \".*\"" | awk -F "version = \"|\"" '{print $2}')
          gh release create $PACKAGE_VERSION
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Poetry
        uses: abatilo/actions-poetry@v4

      - name: Build package
        run: poetry build

      - name: Publish package
        run: |
          poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
          poetry publish

